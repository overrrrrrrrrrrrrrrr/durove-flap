<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Durov on Telegram Logo vs Realism</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050608;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            background: #0a0f1d;
            box-shadow: 0 15px 45px rgba(0,0,0,0.9), 0 0 25px rgba(34,158,217,0.15);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            height: 600px;
        }
        .hud {
            position: absolute;
            top: 25px;
            font-size: 32px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hud" id="score">0</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Игрок: Телеграм-логотип снизу, а на нем стоит Дуров
        let player = {
            x: 90,
            y: 300,
            radius: 20, // радиус круга лого ТГ
            gravity: 0.36,
            lift: -6.8,
            velocity: 0,
            tilt: 0
        };

        let pipes = [];
        let pipeWidth = 76;
        let pipeGap = 195;
        let pipeSpeed = 2.3;
        let frameCount = 0;
        let score = 0;
        let gameOver = false;
        let gameStarted = false;

        // Пыль/фонари на фоне
        let clouds = Array.from({length: 15}, () => ({
            x: Math.random() * 400,
            y: Math.random() * 600,
            speed: 0.3 + Math.random() * 0.7,
            w: 40 + Math.random() * 60,
            h: 15
        }));

        function jump() {
            if (!gameStarted) gameStarted = true;
            if (gameOver) {
                resetGame();
            } else {
                player.velocity = player.lift;
            }
        }

        window.addEventListener('keydown', e => { if (e.code === 'Space') jump(); });
        canvas.addr || canvas.addEventListener('pointerdown', jump);
        canvas.addEventListener('pointerdown', jump);

        function resetGame() {
            player.y = 300;
            player.velocity = 0;
            pipes = [];
            score = 0;
            scoreEl.innerText = score;
            gameOver = false;
        }

        // Рендер Дурова, стоящего НА логотипе Telegram
        function drawDurovOnLogo(x, y, radius, velocity) {
            ctx.save();
            ctx.translate(x, y);
            
            // Наклон при полете
            let tilt = Math.max(-0.25, Math.min(0.25, velocity * 0.03));
            ctx.rotate(tilt);

            // 1. Отрисовка круглого логотипа Telegram снизу (база)
            ctx.fillStyle = '#229ed9';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // Белый бумажный самолетик внутри логотипа
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-radius*0.4, -radius*0.1);
            ctx.lineTo(radius*0.45, 0);
            ctx.lineTo(-radius*0.35, radius*0.35);
            ctx.lineTo(-radius*0.15, 0.05);
            ctx.closePath();
            ctx.fill();

            // 2. Отрисовка Дурова стоя НАУКРАЕУ / ПОВЕРХ логотипа (сдвиг вверх по Y)
            const dY = -radius - 24; // смещение вверх над кругом

            // Ноги / стойка
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-6, dY + 20, 4, 10);
            ctx.fillRect(2, dY + 20, 4, 10);

            // Черная водолазка / корпус
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(-10, dY + 6, 20, 16, 4);
            ctx.fill();

            // Руки в стороны для баланса
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-10, dY + 10);
            ctx.lineTo(-18, dY + 14);
            ctx.moveTo(10, dY + 10);
            ctx.lineTo(18, dY + 14);
            ctx.stroke();

            // Голова / лицо (волосы темные назад)
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(0, dY, 7, Math.PI, Math.PI * 2);
            ctx.fill();

            // Лицо (телесное)
            ctx.fillStyle = '#fde68a';
            ctx.beginPath();
            ctx.arc(0, dY + 2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Фирменные очки (темные линией)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-4, dY + 1);
            ctx.lineTo(4, dY + 1);
            ctx.stroke();

            ctx.restore();
        }

        // Реалистичная советская панелька (с швами, балконами, блоками кондиционеров)
        function drawPanelBuilding(x, topHeight, bottomY) {
            const width = pipeWidth;
            const bottomHeight = canvas.height - bottomY;

            // Конкретные бетонные секции (верх)
            ctx.fillStyle = '#566573';
            ctx.fillRect(x, 0, width, topHeight);
            
            // Парапет сверху
            ctx.fillStyle = '#34495e';
            ctx.fillRect(x - 4, topHeight - 14, width + 8, 14);

            // Текстура панельных швов и сетка окон
            for (let wy = 18; wy < topHeight - 20; wy += 32) {
                // Горизонтальный шов панели
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(x, wy - 2, width, 2);

                for (let wx = 8; wx < width - 18; wx += 22) {
                    // Окно
                    const lit = ((wx * 7 + wy * 13) % 4 !== 0);
                    ctx.fillStyle = lit ? '#f9e79f' : '#1b2631';
                    ctx.fillRect(x + wx, wy, 14, 20);
                    
                    // Рамы
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + wx, wy, 14, 20);
                }
            }

            // Балконы выступающие (на случайной высоте)
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x - 6, topHeight - 50, width + 12, 6);

            // Низ (панелька снизу)
            ctx.fillStyle = '#566573';
            ctx.fillRect(x, bottomY, width, bottomHeight);
            ctx.fillStyle = '#34495e';
            ctx.fillRect(x - 4, bottomY, width + 8, 14);

            for (let wy = bottomY + 25; wy < canvas.height - 15; wy += 32) {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(x, wy - 2, width, 2);
                for (let wx = 8; wx < width - 18; wx += 22) {
                    const lit = ((wx * 3 + wy * 11) % 3 !== 0);
                    ctx.fillStyle = lit ? '#f9e79f' : '#1b2631';
                    ctx.fillRect(x + wx, wy, 14, 20);
                    ctx.strokeStyle = '#2c3e50';
                    ctx.strokeRect(x + wx, wy, 14, 20);
                }
            }
        }

        // Реалистичная ажурная Эйфелева башня (металлические раскосы)
        function drawEiffelTower(x, topHeight, bottomY) {
            const width = pipeWidth;
            const bottomHeight = canvas.height - bottomY;

            ctx.strokeStyle = '#a04000';
            ctx.lineWidth = 3;

            // Верхняя ферма
            ctx.beginPath();
            ctx.moveTo(x + width/2, 0);
            ctx.lineTo(x + width/5, topHeight);
            ctx.lineTo(x + (width*4)/5, topHeight);
            ctx.closePath();
            ctx.stroke();

            // Решетка фермы верх
            ctx.beginPath();
            ctx.moveTo(x + width/3, topHeight*0.4);
            ctx.lineTo(x + (width*2)/3, topHeight*0.4);
            ctx.moveTo(x + width/4, topHeight*0.7);
            ctx.lineTo(x + (width*3)/4, topHeight*0.7);
            ctx.stroke();

            // Смотровая площадка верх
            ctx.fillStyle = '#6e2c00';
            ctx.fillRect(x + width/5 - 4, topHeight - 6, width*0.6 + 8, 6);

            // Нижняя ферма
            ctx.beginPath();
            ctx.moveTo(x + width/5, bottomY);
            ctx.lineTo(x + width/2, canvas.height);
            ctx.lineTo(x + (width*4)/5, bottomY);
            ctx.closePath();
            ctx.stroke();

            // Перекрестные балки Эйфелевой башни
            ctx.strokeStyle = '#784212';
            ctx.lineWidth = 2;
            for (let py = bottomY + 20; py < canvas.height - 30; py += 35) {
                ctx.beginPath();
                ctx.moveTo(x + width/3, py);
                ctx.lineTo(x + (width*2)/3, py + 25);
                ctx.moveTo(x + (width*2)/3, py);
                ctx.lineTo(x + width/3, py + 25);
                ctx.stroke();
            }
            
            // Платформа низа
            ctx.fillStyle = '#6e2c00';
            ctx.fillRect(x + width/5 - 6, bottomY, width*0.6 + 12, 8);
        }

        function update() {
            if (!gameStarted || gameOver) return;

            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.w < 0) c.x = 400;
            });

            player.velocity += player.gravity;
            player.y += player.velocity;

            frameCount++;
            if (frameCount % 110 === 0) {
                let minTop = 80;
                let maxTop = canvas.height - pipeGap - 110;
                let topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
                let type = Math.random() > 0.45 ? 'panel' : 'eiffel';
                pipes.push({
                    x: canvas.width,
                    topHeight: topH,
                    bottomY: topH + pipeGap,
                    type: type,
                    passed: false
                });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                if (!pipes[i].passed && pipes[i].x + pipeWidth < player.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreEl.innerText = score;
                }

                let p = pipes[i];
                // Хитбокс по кругу игрока
                if (
                    player.x + player.radius > p.x + 4 &&
                    player.x - player.radius < p.x + pipeWidth - 4 &&
                    (player.y - player.radius < p.topHeight || player.y + player.radius > p.bottomY)
                ) {
                    gameOver = true;
                }

                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            if (player.y + player.radius > canvas.height || player.y - player.radius - 35 < 0) {
                gameOver = true;
            }
        }

        function draw() {
            // Темный индустриальный фон ночи
            ctx.fillStyle = '#060911';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Атмосферные туманы/облака
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            clouds.forEach(c => {
                ctx.fillRect(c.x, c.y, c.w, c.h);
            });

            // Рендер препятствий
            pipes.forEach(p => {
                if (p.type === 'panel') {
                    drawPanelBuilding(p.x, p.topHeight, p.bottomY);
                } else {
                    drawEiffelTower(p.x, p.topHeight, p.bottomY);
                }
            });

            // Рендер Дурова на ТГ-логотипе
            drawDurovOnLogo(player.x, player.y, player.radius, player.velocity);

            if (!gameStarted) {
                ctx.fillStyle = 'rgba(6,9,17,0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 22px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('ТАП / ПРОБЕЛ', canvas.width/2, canvas.height/2 - 15);
                ctx.font = '13px system-ui';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('Дуров стоит на логотипе ТГ против панелей и Парижа', canvas.width/2, canvas.height/2 + 15);
            } else if (gameOver) {
                ctx.fillStyle = 'rgba(6,9,17,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f87171';
                ctx.font = 'bold 26px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('ДЕЛЕТЕЙШН СУРОВ', canvas.width/2, canvas.height/2 - 20);
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '15px system-ui';
                ctx.fillText(`Счет: ${score} | Тап для повтора`, canvas.width/2, canvas.height/2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
